<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padis Article</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <!-- 1. LOADER SCREEN - 3 SECONDS -->
  <div id="loader">
    <div class="loader-logo">
      <!-- PADIS SVG LOGO -->
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:hsla(360, 92%, 34%, 1);" />
            <stop offset="100%" style="stop-color:hsla(230, 60%, 73%, 1);" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
        <text x="50" y="60" text-anchor="middle" font-size="40" fill="white" font-weight="900" font-family="Arial">P</text>
      </svg>
    </div>
    <h1>Padis Article</h1>
    <p>Latest News • Programming • Design</p>
    <div class="loader-bar"><div class="loader-progress"></div></div>
  </div>

  <!-- 2. MAIN CONTENT -->
  <div id="container">
    <div id="box">
      <!-- ADSTERRA BANNER 1 - TOP -->
      <div class="adsbox">
        <!-- REPLACE THIS WITH YOUR ADSTERRA BANNER CODE -->
        <script type='text/javascript' src='//pl0000000.profitableratecpm.com/00/00/000.js'></script>
      </div>
      
      <!-- REMOVED "WELCOME TO PADIS" - NOW CATEGORY IS ON TOP -->
      <div id="cat">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="programming">Programming</button>
        <button class="cat-btn" data-cat="update">Update</button>
        <button class="cat-btn" data-cat="graphic">Graphic Design</button>
      </div>
    </div>
    
    <!-- 3. BIGGER CONTENT AREA -->
    <div class="content" id="articles-container"></div>

    <!-- ADSTERRA BANNER 2 - BOTTOM -->
    <div class="adsbox-bottom">
      <!-- REPLACE THIS WITH YOUR ADSTERRA BANNER CODE -->
      <script type='text/javascript' src='//pl0000.profitableratecpm.com/00/00/000000.js'></script>
    </div>
  </div>

  <div id="reactions">
    <button id="like"><i class="fa-solid fa-heart"></i></button>
    <button id="share"><i class="fa-solid fa-share"></i></button>
    <a href="https://chat.whatsapp.com/Gfglg3EGsi534yNHMGE3pD" target="_blank">
      <button id="group"><i class="fa-brands fa-whatsapp"></i></button>
    </a>
  </div>
  <div class="loveshow non-active" id="loves"><i class="fa-solid fa-heart"></i></div>

  <script type="module" src="main.js"></script>
</body>
  </html>
